[package]
name = "mpv-mpris2"
version = "0.1.3"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Rust implementation of the MPRIS v2 DBus interface for the mpv media player."
repository = "https://github.com/eNV25/mpv-mpris2"
publish = false

[dependencies]
anyhow = "1"
compact_str = { version = "0.10", features = ["serde"] }
derive-deftly = "1"
enumflags2 = "0.7"
futures-concurrency = "7"
futures-lite = { version = "2" , features = ["memchr"]}
kanal = "0.1"
libc = "0.2"
mpris-server = { version = "0.11", features = ["unstable"] }
oneshot = { version = "0.2", features = ["async", "std"] }
pico-args = { version = "0.5", features = ["eq-separator"] }
serde = { version = "1", features = ["derive"] }
serde-constant = "0.1"
serde_json = "1"
serde_variant = "0.1"
serde_with = "3"
slab = "0.4"
strum = { version = "0.28", features = ["derive"] }
tempfile = { version = "3", default-features = false }
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "smallvec", "std"] }
url = { version = "2", features = ["serde"] }
zbus = { version = "6" , default-features = false, features = ["default-rt", "tracing", "service"]}
zruntime = { version = "0.2", default-features = false, features = ["runtime", "tracing", "lock", "unix", "process"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Used by cargo-dist for release builds.
[profile.dist]
inherits = "release"
